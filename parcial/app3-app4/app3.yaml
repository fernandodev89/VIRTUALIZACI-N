apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: parcial-fdcm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: traefik/whoami:v1.10
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app3-service
  namespace: parcial-fdcm
spec:
  selector:
    app: app3
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
