apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd-fdcm
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
patches:
  - path: cmd-params-patch.yaml
  # Subjects de los ClusterRoleBinding apuntan al namespace propio
  - target:
      kind: ClusterRoleBinding
      name: argocd-.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: argocd-fdcm
  # Workaround local: DNS inestable en Minikube, imágenes precargadas
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: argocd-repo-server|argocd-redis|argocd-dex-server
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent