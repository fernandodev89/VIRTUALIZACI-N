# Promtail (DaemonSet) - envía logs a Loki
# Solo recolecta logs de los namespaces parcial-fdcm y traefik
config:
  clients:
    - url: http://loki.monitoring-fdcm.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    extraRelabelConfigs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: parcial-fdcm|traefik
        action: keep

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
